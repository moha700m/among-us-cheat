name: Build AmongUsCheat.exe

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with MinGW (msys64)
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          g++ -O2 -std=c++17 \
            -static -static-libgcc -static-libstdc++ \
            -o AmongUsCheat.exe among_us_cheat.cpp \
            -lpsapi -lwinmm -mwindows \
            -Wl,-Bstatic -lpthread -Wl,-Bdynamic
          echo "=== Build complete ==="
          ls -lh AmongUsCheat.exe

      - name: Show DLL dependencies
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          echo "--- All DLL imports ---"
          objdump -p AmongUsCheat.exe | grep "DLL Name"

      - name: Package ZIP with DLLs + README
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          MINGW_BIN=$(dirname "$(which g++)")
          echo "MinGW bin dir: $MINGW_BIN"

          mkdir -p dist
          cp AmongUsCheat.exe dist/

          # Write README directly with printf to avoid heredoc indent issues
          printf '%s\n' \
            "==========================================" \
            " AMONG US EXTERNAL CHEAT - KAKU DEV" \
            "==========================================" \
            "" \
            "REQUIREMENTS:" \
            "  - Windows 10/11 (64-bit)" \
            "  - Among Us running (Steam)" \
            "  - Run as Administrator" \
            "" \
            "HOW TO USE:" \
            "  1. Extract ALL files from this zip to one folder" \
            "  2. Launch Among Us" \
            "  3. Right-click AmongUsCheat.exe -> Run as Administrator" \
            "  4. Wait for Attached! message in the console" \
            "" \
            "HOTKEYS:" \
            "  F1   Speed Hack (3x default)" \
            "  F2   Infinite Vision" \
            "  F3   No Kill Cooldown" \
            "  F4   Reveal Impostors (ESP)" \
            "  F5   Always Impostor" \
            "  F6   Ghost Mode (No Clip)" \
            "  F7   Auto Kill (nearest)" \
            "  F8   Walls / Position ESP" \
            "  F9   Set custom speed multiplier" \
            "  F10  Re-attach to Among Us" \
            "  F11  Dump all player positions" \
            "  END  Exit cleanly (restores original values)" \
            "" \
            "NOTES:" \
            "  - Keep ALL files in the SAME folder as the exe" \
            "  - Closes cleanly on END key, restoring speed/vision" \
            "  - Offsets for Among Us v2024 (GameAssembly.dll)" \
            "  - Requires Administrator rights to read game memory" \
            > dist/README.txt

          # Bundle any needed MinGW runtime DLLs
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if objdump -p dist/AmongUsCheat.exe | grep -qi "$dll"; then
              echo "Bundling $dll"
              dll_path="$MINGW_BIN/$dll"
              if [ -f "$dll_path" ]; then
                cp "$dll_path" dist/
              else
                echo "WARNING: $dll needed but not found at $dll_path"
                find /c/msys64 -name "$dll" 2>/dev/null | head -1 | xargs -I{} cp {} dist/ || echo "Could not find $dll anywhere"
              fi
            fi
          done

          echo "=== dist contents ==="
          ls -lh dist/

          # Use PowerShell's Compress-Archive (always available on windows-latest)
          powershell -Command "Compress-Archive -Path 'dist\\*' -DestinationPath 'AmongUsCheat_Package.zip' -Force"
          echo "=== ZIP ready ==="
          ls -lh AmongUsCheat_Package.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsCheat-exe
          path: AmongUsCheat.exe
          retention-days: 90

      - name: Upload full ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsCheat-ZIP
          path: AmongUsCheat_Package.zip
          retention-days: 90

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AmongUsCheat.exe
            AmongUsCheat_Package.zip
